<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>轻读透明原型</title>
<style>
body { margin: 0; background: white; }
.readerChapterContent { padding: 36px; }
.renderTargetContent p { font-size: 22px; line-height: 40px; margin-bottom: 20px; }
#canvas { position: absolute; left: 40px; top: 350px; }
#reference { position: absolute; left: 180px; top: 365px; width: 12px; height: 12px; background: #D4AF37; }
#outside { color: rgb(20,40,60); background: white; position: absolute; top: 430px; left: 40px; }
</style></head><body>
<div class="wr_horizontalReader"><div class="readerTopBar">此导航应隐藏并保留空间</div>
<div class="readerChapterContent"><div class="renderTargetContent">
<p id="text">轻读 · Windows 透明窗口原型</p>
<p>背景应透出桌面，正文保持金色。按住 Alt 拖动文字区域移动窗口。</p>
<p>Ctrl + 0 隐藏或恢复；托盘菜单可切换深色背景、退出。</p>
</div><div class="wr_canvasContainer"><canvas id="canvas" width="120" height="50"></canvas></div>
<div id="reference"></div><button class="renderTarget_pager_button">下一页</button></div></div>
<div id="outside">普通界面保留自己的底色与文字</div>
<script>
window.firstLayout = {
  font: getComputedStyle(document.querySelector('#text')).fontFamily,
  height: getComputedStyle(document.querySelector('#text')).lineHeight,
  margin: getComputedStyle(document.querySelector('#text')).marginBottom
};
const ctx = document.querySelector('#canvas').getContext('2d');
ctx.fillStyle = 'black'; ctx.fillRect(10, 10, 20, 20);
window.turns = 0;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') window.turns++; });
window.startBusy = () => {
  window.chrome.webview.postMessage('busy');
  const end = performance.now() + 2000;
  while (performance.now() < end) {}
  window.chrome.webview.postMessage('idle');
};
</script></body></html>
