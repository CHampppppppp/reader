<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>轻读透明原型</title>
<style>
body { margin: 0; background: white; }
.readerChapterContent { padding: 36px; }
.renderTargetContent p { font-size: 22px; line-height: 40px; margin-bottom: 20px; }
#canvas { position: absolute; left: 40px; top: 350px; }
#reference { position: absolute; left: 180px; top: 365px; width: 12px; height: 12px; background: #D4AF37; }
#outside { color: rgb(20,40,60); background: white; position: absolute; top: 430px; left: 40px; }
</style></head><body>
<div class="wr_horizontalReader"><div class="readerTopBar">此导航应隐藏并保留空间</div>
<div class="readerChapterContent"><div class="renderTargetContent">
<p id="text">轻读 · Windows 透明窗口原型</p>
<p>背景应透出桌面，正文保持金色。按住 Alt 拖动文字区域移动窗口。</p>
<p>Ctrl + ↑ 隐藏或恢复；官网内 ←／→ 翻页，↓ 返回选书页；托盘菜单可切换深色背景、退出。</p>
</div><div class="wr_canvasContainer"><canvas id="canvas" width="120" height="50"></canvas></div>
<div class="wr_canvasContainer"><canvas id="glyphCanvas" width="120" height="60" style="position:absolute;left:40px;top:500px"></canvas></div>
<canvas id="glyphReference" width="120" height="60" style="position:absolute;left:200px;top:500px"></canvas>
<div id="reference"></div><canvas id="illustration" width="20" height="20" style="position:absolute;left:220px;top:365px"></canvas>
<div style="position:absolute;left:250px;top:365px;width:10px;height:10px;background:red"></div>
<button class="renderTarget_pager_button">下一页</button></div></div>
<div id="outside">普通界面保留自己的底色与文字</div>
<script>
window.firstLayout = {
  color: getComputedStyle(document.querySelector('#text')).color,
  font: getComputedStyle(document.querySelector('#text')).fontFamily,
  height: getComputedStyle(document.querySelector('#text')).lineHeight,
  margin: getComputedStyle(document.querySelector('#text')).marginBottom
};
const ctx = document.querySelector('#canvas').getContext('2d');
ctx.fillStyle = 'black'; ctx.fillRect(10, 10, 20, 20);
for (const id of ['glyphCanvas', 'glyphReference']) {
  const canvas = document.getElementById(id);
  // Match physical pixel phases even with a custom Windows display scale.
  const ratio = window.devicePixelRatio;
  canvas.style.left = `${Math.round(parseFloat(canvas.style.left) * ratio) / ratio}px`;
  canvas.style.top = `${Math.round(parseFloat(canvas.style.top) * ratio) / ratio}px`;
  const glyph = canvas.getContext('2d');
  glyph.font = '500 22px "Microsoft YaHei"'; glyph.fillText('清晰阅读 Aa', 4, 30);
  glyph.globalAlpha = 0.25; glyph.fillRect(100, 40, 10, 10);
}
const picture = document.querySelector('#illustration').getContext('2d');
picture.fillStyle = 'red'; picture.fillRect(0, 0, 20, 20);
window.turns = 0;
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') window.turns++; });
window.startBusy = () => {
  window.chrome.webview.postMessage('busy');
  const end = performance.now() + 2000;
  while (performance.now() < end) {}
  window.chrome.webview.postMessage('idle');
};
</script></body></html>
